
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jogos Cadastrados</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e8e8e8;
            color: #222;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: black;
            margin-bottom: 30px;
            font-size: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 5px;
            overflow: hidden;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #7777e0;
            color: white;
            font-size: 16px;
        }

        td {
            color: #333;
        }

        tbody tr {
            transition: background-color 0.3s;
        }

        tbody tr:hover {
            background-color: #f2f2f2;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 18px;
                overflow-x: auto;
            }

            h1 {
                font-size: 25px;
                margin-bottom: 20px;
            }

            table {
                min-width: 450px;
                font-size: 13px;
            }

            th, td {
                padding: 10px 8px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Jogos Cadastrados</h1>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Plataforma</th>
                    <th>Ano</th>
                    <th>Desenvolvedora</th>
					<th>Ação</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="jogo : ${jogos}">
                    <td th:text="${jogo.nome}"></td>
                    <td th:text="${jogo.plataforma}"></td>
                    <td th:text="${jogo.anoLancamento}"></td>
                    <td th:text="${jogo.desenvolvedora}"></td>
					<td>
						<a th:href="@{/paginas/jogos/{id}/editar(id=${jogo.id})}">Editar</a>
						    <form th:action="@{/paginas/jogos/{id}/remover(id=${jogo.id})}" method="post">
						        <button type="submit">Remover</button>
						    </form>	
					</td>
				</tr>
            </tbody>
        </table>
    </div>
</body>
</html>
