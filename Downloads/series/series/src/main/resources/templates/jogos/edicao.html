
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Jogo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e8e8e8;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: black;
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f7f7f7;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e50914;
            background-color: #fff;
        }

        span {
            display: block;
            color: #d00000;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #7777e0;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #b20710;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Editar jogos</h1>

        <form method="post" action="/paginas/jogos/editar" th:object="${jogo}">

			<input type="hidden" th:field="*{id}">
			
            <p>
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}">
                <span th:errors="*{nome}"></span>
            </p>

            <p>
                <label for="anoLancamento">Ano Lançamento</label>
                <input type="number" id="anoLancamento"
                       th:field="*{anoLancamento}">
                <span th:errors="*{anoLancamento}"></span>
            </p>

            <p>
                <label for="plataforma">Plataforma</label>
                <input type="text" id="plataforma"
                       th:field="*{plataforma}">
                <span th:errors="*{plataforma}"></span>
            </p>

            <p>
                <label for="desenvolvedora">desenvolvedora</label>
                <input type="text" id="desenvolvedora" th:field="*{desenvolvedora}">
                <span th:errors="*{desenvolvedora}"></span>
            </p>

            <button type="submit">Editar</button>
        </form>
    </div>
</body>
</html>
